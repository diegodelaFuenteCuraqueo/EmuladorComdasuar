name: Deploy Dev (Emulador COMDASUAR)

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build browser bundle
      run: npm run build:browser

    - name: Assemble dist (sitio estático)
      run: |
        mkdir -p dist
        cp test/manual.html dist/index.html
        cp test/comdasuar.browser.js dist/
        cp -r test/scores dist/scores
        cp -r src dist/src
        cp README.md dist/README.md
        cp package.json dist/package.json

    - name: Deploy to FTP server (entorno dev)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.delaefe.site
        username: ${{ secrets.FTPUSERNAME }}
        password: ${{ secrets.FTPPASSWORD }}
        protocol: ftp
        timeout: 240000
        passive: false
        server-dir: public_html/dev/ecomdasuar
        local-dir: dist/
        log-level: verbose
